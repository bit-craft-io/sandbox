apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/app/api

labels:
  - pairs:
      env: local

images:
  - name: img-backend
    newName: ${KUSTOMIZE_IMG_NAME}
    newTag: latest

patches:
  - target:
      kind: Service
      name: svc-api
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: svc-api
      spec:
        ports:
          - name: http
            protocol: TCP
            port: 8080
            targetPort: 8080
            nodePort: 30080
  - target:
      kind: Deployment
      name: deploy-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: deploy-api
      spec:
        template:
          spec:
            containers:
              - name: api
                imagePullPolicy: Always
                envFrom:
                  - configMapRef:
                      name: ${KUSTOMIZE_APP_NAME}-env