apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/app/api

labels:
  - pairs:
      env: local

images:
  - name: img-backend
    newName: ${KUSTOMIZE_IMG_NAME}
    newTag: latest

patches:
  - target:
      kind: Service
      name: svc-api
    patch: |
      - op: replace
        path: /spec/ports
        value:
          - name: http
            protocol: TCP
            port: 8080
            targetPort: 8080
            nodePort: 30080
  - target:
      kind: Deployment
      name: deploy-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: ${KUSTOMIZE_APP_NAME}-env