apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/app/api

labels:
  - pairs:
      env: local

images:
  - name: img-backend
    newName: ${KUSTOMIZE_IMG_NAME}
    newTag: latest

patches:
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: svc-api
      spec:
        ports:
          - port: 8080
            nodePort: 30081
    target:
      kind: Service
      name: svc-api
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: deploy-api
      spec:
        template:
          spec:
            containers:
              - name: api
                imagePullPolicy: IfNotPresent
    target:
      kind: Deployment
      name: deploy-api
