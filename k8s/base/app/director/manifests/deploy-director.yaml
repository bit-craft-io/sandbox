apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-director
  labels:
    app: director
spec:
  replicas: 1
  selector:
    matchLabels:
      app: director
  template:
    metadata:
      labels:
        app: director
    spec:
      containers:
        - name: director
          image: img-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
      restartPolicy: Always