apiVersion: v1
kind: Secret
metadata:
  labels:
    k8s-app: kubernetes-dashboard
  name: kubernetes-dashboard-certs
  namespace: kubernetes-dashboard
type: Opaque
# 1. base64に変換して設定
data:
  tls.crt: 
  tls.key: 
# 2. 証明書をインポート
# Windows環境 で ショートカット（#+r） で certmgr.msc を入力して証明書の画面を開く
# rootCA.pemを 信頼されたルート証明期間 証明書 インポートをする

---

apiVersion: v1
kind: Secret
metadata:
  labels:
    k8s-app: kubernetes-dashboard
  name: kubernetes-dashboard-csrf
  namespace: kubernetes-dashboard
type: Opaque
data:
  csrf: ""
