services:
  youtrack:
    container_name: youtrack
    image: jetbrains/youtrack:2025.3.121962
    user: "0:0"
    ports:
      - "13080:8080"
    volumes:
      - ./opt/youtrack/data:/opt/youtrack/data
      - ./opt/youtrack/conf:/opt/youtrack/conf
      - ./opt/youtrack/logs:/opt/youtrack/logs
      - ./opt/youtrack/backups:/opt/youtrack/backups
      - youtrack_temp:/opt/youtrack/temp
    restart: unless-stopped
volumes:
  youtrack_temp:
#  youtrack_data:
#  youtrack_conf:
#  youtrack_logs:
#  youtrack_backups: