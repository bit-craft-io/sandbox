services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "50021:50021"
    networks:
      - dify_default
  ollama-base:
    image: ollama/ollama:latest
    container_name: ollama-base
    environment:
      - TZ=Asia/Tokyo
      - OLLAMA_KEEP_ALIVE=24h
      - __OLLAMA_MODEL=${__OLLAMA_MODEL}
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    networks:
      - dify_default
  ollama-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ollama-proxy
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=http://host.docker.internal:11434
    command: --model ollama_chat/${__OLLAMA_MODEL} --alias ${__OLLAMA_MODEL} --port 4000
    restart: always
    networks:
      - dify_default
networks:
  dify_default:
    driver: bridge
volumes:
  open-webui:
  #  langgraph-data:
  langflow-data: