services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "50021:50021"
    networks:
      - ollama-net
  langgraph-api:
    build:
      context: ./langgraph
      dockerfile: Dockerfile
    container_name: langgraph-api
    ports:
      - "8123:8123"
    environment:
      - LANGCHAIN_TRACING_V2=false
      - LANGGRAPH_DATABASE_URL=sqlite:////app/data/langgraph.db
      # agent 毎に使用変数が異なる
      - OPENAI_API_KEY=${__OPENAI_API_KEY}
      - GEMINI_API_KEY=${__GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${__ANTHROPIC_API_KEY}
      - LANGCHAIN_API_KEY=${__LANGCHAIN_API_KEY}
      - LANGSMITH_API_KEY=${__LANGSMITH_API_KEY}
    volumes:
      - ./langgraph:/app
      - langgraph-data:/app/data
    networks:
      - ollama-net
  ollama-base:
    image: ollama/ollama:latest
    container_name: ollama-base
    environment:
      - TZ=Asia/Tokyo
      - __OLLAMA_MODEL=${__OLLAMA_MODEL}
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama:ro
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    networks:
      - ollama-net
  ollama-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ollama-proxy
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=http://host.docker.internal:11434
    command: --model ollama_chat/${__OLLAMA_MODEL} --alias ${__OLLAMA_MODEL} --port 4000
    restart: always
    networks:
      - ollama-net
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://ollama-proxy:4000
      - OPENAI_API_KEY=dummy
      - DEFAULT_MODELS=${__OLLAMA_MODEL}
      # admin settings（Falseは大文字、WebUIが文字列で判断している模様（バグ））
      - WEBUI_AUTH=False
      - WEBUI_SECRET_KEY=any_random_string
      ## local cache only
      - HF_HUB_OFFLINE=1
    depends_on:
      - ollama-proxy
    volumes:
      - open-webui:/app/backend/data
    restart: always
    networks:
      - ollama-net
networks:
  ollama-net:
    driver: bridge
volumes:
  open-webui:
  langgraph-data: