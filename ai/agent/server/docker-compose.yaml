  langflow-init:
    image: alpine
    container_name: langflow-init
    command: chown -R 1000:0 /app/data
    volumes:
      - langflow-data:/app/data
#      - ./langflow/data:/app/data
  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    depends_on:
      langflow-init:
        condition: service_completed_successfully
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_DATABASE_URL=sqlite:////app/data/langflow.db
      - LANGFLOW_AUTO_LOGIN=True
      - LANGFLOW_SUPERUSER=root
      - LANGFLOW_SUPERUSER_PASSWORD=root

      # コンテナ作成の都度、Langflow API Keys を再作成の手間を省く
      - LANGFLOW_API_KEY_SOURCE=env
      - LANGFLOW_API_KEY=${__LANGFLOW_API_KEY}
      - LANGFLOW_LOAD_FLOWS_PATH=/app/flows
      - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true

      - OPENAI_API_KEY=${__OPENAI_API_KEY}
      - GEMINI_API_KEY=${__GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${__ANTHROPIC_API_KEY}


#      - LANGCHAIN_API_KEY=${__LANGCHAIN_API_KEY}
#      - LANGSMITH_API_KEY=${__LANGSMITH_API_KEY}
    volumes:
      - langflow-data:/app/data
#      - ./langflow/data:/app/data
      - ./langflow/agents:/app/flows
    networks:
      - ollama-net
#  langflow-cleanup:
#    build:
#      context: ./langflow/cleanup
#    container_name: langflow-cleanup
#    environment:
#      - LANGFLOW_API_KEY=${__LANGFLOW_API_KEY}
#    depends_on:
#      - langflow
#    networks:
#      - ollama-net
#    restart: always
  ollama-base:
    image: ollama/ollama:latest
    container_name: ollama-base
    environment:
      - TZ=Asia/Tokyo
      - OLLAMA_KEEP_ALIVE=24h
      - __OLLAMA_MODEL=${__OLLAMA_MODEL}
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    networks:
      - ollama-net
  ollama-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ollama-proxy
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=http://host.docker.internal:11434
    command: --model ollama_chat/${__OLLAMA_MODEL} --alias ${__OLLAMA_MODEL} --port 4000
    restart: always
    networks:
      - ollama-net
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://ollama-proxy:4000
      - OPENAI_API_KEY=dummy
      - DEFAULT_MODELS=${__OLLAMA_MODEL}
      # admin settings（Falseは大文字、WebUIが文字列で判断している模様（バグ））
      - WEBUI_AUTH=False
      - WEBUI_SECRET_KEY=any_random_string
      ## local cache only
      - HF_HUB_OFFLINE=1
    depends_on:
      - ollama-proxy
    volumes:
      - open-webui:/app/backend/data
    restart: always
    networks:
      - ollama-net
networks:
  ollama-net:
    driver: bridge
volumes:
  open-webui:
#  langgraph-data:
  langflow-data: